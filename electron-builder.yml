appId: com.tiijima.lumina-code
productName: Lumina Code
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**
# 6.12: 同梱するオープンソースのライセンス一覧（npm run build で作る）
extraResources:
  - from: resources/licenses.json
    to: licenses.json
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # GitHub はアップロード時にファイル名の空白を「.」に変えるため、latest.yml と食い違わないよう空白を含めない
  artifactName: ${name}-setup-${version}.${ext}
  # 10.4: アンインストール時にアプリデータを削除するかを選ぶ（build/installer.nsh）
  include: build/installer.nsh
# CMN-03: 更新の配信元（GitHub Releases の公開リポジトリ。リリース専用で、ソースは置かない）
# ビルド時に resources\app-update.yml が作られ、アプリは公開済みのリリースの latest.yml を確認する。
# 公開リポジトリのため、アプリにトークンは持たせない
publish:
  provider: github
  owner: iijimatakayuki0402
  repo: LuminaCode
  releaseType: release
